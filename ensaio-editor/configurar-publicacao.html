<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicação — Ensaio do editor</title>
<style>body{margin:0;background:#edf3f5;color:#193746;font:16px system-ui,sans-serif}main{max-width:480px;margin:50px auto;padding:28px;background:white;border-radius:16px}h1{font-size:23px}label{display:block;margin:18px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aebfc6;border-radius:6px;font:inherit}button{margin-top:20px;background:#155b74;border:0;color:white;padding:12px 20px;border-radius:6px;font:inherit;cursor:pointer}button:disabled{opacity:.5}a{color:#155b74}.hidden{display:none}#status{white-space:pre-line;line-height:1.5}</style>
<main><h1>Publicação do editor de ensaio</h1><p>Destino: <b>INSMISAU/manual-surtos-teste/ensaio-editor</b></p>
<form id="login"><label for="email">Email da conta administradora de ensaio</label><input id="email" type="email" autocomplete="username" required><label for="password">Palavra-passe da conta de ensaio</label><input id="password" type="password" autocomplete="current-password" required><button>Entrar</button></form>
<form id="config" class="hidden"><label for="token">Credencial GitHub exclusiva de ensaio</label><input id="token" type="password" autocomplete="off" spellcheck="false" required><p>Use uma credencial com acesso apenas ao repositório de testes e prazo curto.</p><button id="save">Guardar ligação de publicação</button></form>
<p id="status" role="status" aria-live="polite"></p><p><a href="cms.html">Abrir o editor de ensaio</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
<script>
const sb=supabase.createClient('https://dzapfepnqiuljjbkkyra.supabase.co','sb_publishable_VIND_IBkHbgOWIzNES4uzA_LtcRaGrw',{auth:{persistSession:false,autoRefreshToken:false}});
const el=id=>document.getElementById(id);const status=message=>el('status').textContent=message;
el('login').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;status('A verificar a conta…');try{const r=await sb.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});el('password').value='';if(r.error)throw Error('Não foi possível entrar. Confira as credenciais de ensaio.');const p=await sb.from('perfis').select('papel').eq('id',r.data.user.id).single();if(p.error||p.data?.papel!=='admin'){await sb.auth.signOut();throw Error('Esta operação exige a conta administradora de ensaio.');}el('login').classList.add('hidden');el('config').classList.remove('hidden');status('Conta administradora confirmada. Pode guardar a credencial exclusiva de ensaio.');}catch(error){status(error.message);}finally{button.disabled=false;}});
el('config').addEventListener('submit',async event=>{event.preventDefault();el('save').disabled=true;status('A verificar e guardar a ligação…');try{const token=el('token').value.trim();if(!token)throw Error('Introduza a credencial de ensaio.');const check=await fetch('https://api.github.com/repos/INSMISAU/manual-surtos-teste',{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});if(!check.ok)throw Error('A credencial não permite consultar o repositório de testes.');const r=await sb.from('system_settings').upsert({id:1,github_token:token,github_repo:'INSMISAU/manual-surtos-teste',github_test_repo:'INSMISAU/manual-surtos-teste',github_branch:'main'},{onConflict:'id'});if(r.error)throw Error('Não foi possível guardar a ligação. Confira as permissões da conta de ensaio.');el('token').value='';el('config').classList.add('hidden');await sb.auth.signOut();status('Ligação guardada na base independente. Pode abrir o editor e entrar com a conta publicador para o ensaio.');}catch(error){el('token').value='';status(error.message);}finally{el('save').disabled=false;}});
</script></html>
